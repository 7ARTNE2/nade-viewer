name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic version format, for example v0.1.0. Received: $env:RELEASE_TAG"
          }

          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $versions = @(
            (Get-Content package.json -Raw | ConvertFrom-Json).version,
            (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version,
            (& cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          )

          if ($versions | Where-Object { $_ -ne $releaseVersion }) {
            throw "Release tag $env:RELEASE_TAG must match the project version $releaseVersion. Found: $($versions -join ', ')"
          }

      - name: Generate release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $previousTag = git tag --merged HEAD --sort=-version:refname |
            Where-Object { $_ -ne $env:RELEASE_TAG } |
            Select-Object -First 1
          $commitRange = if ($previousTag) { "$previousTag..$env:RELEASE_TAG" } else { $env:RELEASE_TAG }
          $commits = git log $commitRange --format="- [%h](https://github.com/$env:REPOSITORY/commit/%H) %s"

          @(
            "## Changes"
            ""
            $commits
          ) | Set-Content release-notes.md

          if ($previousTag) {
            Add-Content release-notes.md ""
            Add-Content release-notes.md "**Full Changelog**: https://github.com/$env:REPOSITORY/compare/$previousTag...$env:RELEASE_TAG"
          }

      - name: Build Windows installers
        run: npm run tauri:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nade-viewer-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Nade Viewer ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
