name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Report Node.js versions
        run: |
          node --version
          npm --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/nade-parser/go.mod
          cache-dependency-path: plugins/nade-parser/go.sum

      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem plugins/nade-parser -Recurse -Filter *.go | ForEach-Object FullName
          $diff = gofmt -d @files
          if ($diff) {
            $diff
            exit 1
          }

      - name: Vet Go parser
        working-directory: plugins/nade-parser
        run: go vet ./...

      - name: Test Go parser
        working-directory: plugins/nade-parser
        run: go test ./...

      - name: Build Go parser
        working-directory: plugins/nade-parser
        run: go build ./cmd/nade-parser

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Report Rust versions
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: npm run cargo:fmt:check

      - name: Check Rust
        run: npm run cargo:check

      - name: Test Rust
        run: npm run cargo:test

      - name: Run Rust Clippy
        run: npm run cargo:clippy -- --all-targets -- -D warnings
