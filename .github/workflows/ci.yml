name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Report Node.js versions
        run: |
          node --version
          npm --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install browser for replay regressions
        run: npx playwright install chromium

      - name: Test replay UI
        run: npm run test:replay

      - name: Test demo downloader UI
        run: npm run test:downloader

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/nade-parser-v6/go.mod
          cache-dependency-path: |
            plugins/nade-parser/go.sum
            plugins/nade-parser-v6/go.sum

      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem plugins/nade-parser,plugins/nade-parser-v6 -Recurse -Filter *.go | ForEach-Object FullName
          $diff = gofmt -d @files
          if ($diff) {
            $diff
            exit 1
          }

      - name: Vet, test, and build both Go parsers
        shell: pwsh
        run: |
          foreach ($parser in @('plugins/nade-parser', 'plugins/nade-parser-v6')) {
            Push-Location $parser
            try {
              go vet ./...
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              go test ./...
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              go build ./cmd/nade-parser
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
            }
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Report Rust versions
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: npm run cargo:fmt:check

      - name: Check Rust
        run: npm run cargo:check

      - name: Test Rust
        run: npm run cargo:test

      - name: Run Rust Clippy
        run: npm run cargo:clippy -- --all-targets -- -D warnings
