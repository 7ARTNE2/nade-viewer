[package]
name = "nade-viewer"
version = "0.6.0"
description = "Compact desktop grenade lineup explorer"
authors = ["Nade Viewer"]
edition = "2021"

# Keep `tauri dev` responsive on large replay files. The default debug profile
# leaves all Rust dependencies unoptimised, which makes replay I/O and JSON/
# zstd handling noticeably slower than the production build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lib]
name = "nade_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.15"
rmp-serde = "1"
rmp = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2.10.1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
